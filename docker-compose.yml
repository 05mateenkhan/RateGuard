services:

  rate-guard:
    build: .
    container_name: rate-guard
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: rate-guard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rateguard123
      POSTGRES_DB: rateguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rateguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: rate-guard-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10